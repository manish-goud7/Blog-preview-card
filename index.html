<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 11px;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    @font-face {
      font-family: 'Figtree';
      src: url('/assets/fonts/Figtree-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Figtree';
      src: url('/assets/fonts/Figtree-SemiBold.ttf') format('truetype');
      font-weight: 600;
      font-style: normal;
    }

    @font-face {
      font-family: 'Figtree';
      src: url('/assets/fonts/Figtree-ExtraBold.ttf') format('truetype');
      font-weight: 800;
      font-style: normal;
    }

    @tailwind base;
    @tailwind components;
    @tailwind utilities;
  </style>

  <script src="https://cdn.tailwindcss.com">
    module.exports = {
      theme: {
        extend: {
          fontFamily: {
            figtree: ['Figtree', 'sans-serif'],
          },
        },
      },
    };

  </script>

</head>

<body class="bg-[hsl(47,88%,63%)] flex flex-col justify-center items-center min-h-screen p-4">

  <div
    class="font-figtree flex flex-col justify-center bg-white max-w-sm p-4 rounded-xl mb-4 items-center border border-solid border-black shadow-[8px_8px_0px_#000]">
    <div>
      <img src="./assets/images/illustration-article.svg" alt="drawers" class="rounded-xl max-w-xs mb-2 mt-2">
    </div>
    <div class="p-4">
      <span class="bg-[hsl(47,88%,63%)] text-black font-bold px-2 py-1 rounded-md">Learning</span>

      <p class="font-medium mt-4 mb-2">Published 21 Dec 2023</p>

      <h1 class="font-extrabold text-xl mb-2 hover:text-[hsl(47,88%,63%)]">HTML & CSS foundations</h1>

      <p class="font-normal mb-4">These languages are the backbone of every website, defining structure, content, and
        presentation.</p>

      <div class="flex gap-4">
        <img src="./assets/images/image-avatar.webp" alt="Michelle" class="inline-block rounded-full w-8 h-8">
        <p>Greg Hooper</p>
      </div>
    </div>
  </div>


  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>.
    Coded by <a href="#">Maneesh Goud K.E</a>.
  </div>
</body>

</html>
